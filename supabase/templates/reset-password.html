<!--
  Flux — "Reset password" email template.
  Paste into: Supabase Dashboard → Authentication → Email Templates → Reset password.
  Supabase fills {{ .ConfirmationURL }}. Edit the copy freely.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f7;padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr><td align="center">
    <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:14px;border:1px solid #e6e6ee;">
      <tr><td style="padding:28px 32px 8px;">
        <table role="presentation" cellpadding="0" cellspacing="0"><tr>
          <td style="width:30px;height:30px;background:#6e6cf6;border-radius:8px;text-align:center;color:#fff;font-weight:700;font-size:16px;line-height:30px;">F</td>
          <td style="padding-left:10px;font-weight:600;font-size:17px;color:#1c1c22;">Flux</td>
        </tr></table>
      </td></tr>
      <tr><td style="padding:12px 32px 28px;font-size:14px;line-height:1.6;color:#33333b;">
        <h1 style="margin:0 0 12px;font-size:20px;color:#1c1c22;">Reset your password</h1>
        <p style="margin:0 0 14px;">Hi there,</p>
        <p style="margin:0 0 20px;">
          We got a request to reset your Flux password. Click below to choose a
          new one. This link will expire shortly for your security.
        </p>
        <p style="margin:0 0 22px;">
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#6e6cf6;color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:11px 20px;border-radius:9px;">Choose a new password</a>
        </p>
        <p style="margin:0;font-size:12px;color:#9a9aa6;">
          Didn’t request this? You can safely ignore this email — your password
          won’t change.
        </p>
      </td></tr>
    </table>
  </td></tr>
</table>
